name: Release

# Triggered by a v* tag (pushed by the Build workflow when snowball releases,
# or manually). Verifies the committed lib/ matches a fresh build from the
# pinned SNOWBALL_REF, runs the smoke test, publishes to npm with provenance,
# and creates a GitHub release.
#
# npm publishing needs a token with publish permission as the NPM_TOKEN repo
# secret (https://www.npmjs.com/settings/<user>/tokens). `--provenance`
# requires the `id-token: write` permission and a public repository.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Regenerate from pinned SNOWBALL_REF and assert parity
        run: |
          cp -r lib /tmp/lib-before
          bash scripts/build.sh
          git diff --exit-code -- lib SNOWBALL_REF || {
            echo "committed lib/ does not match a fresh build from $(cat SNOWBALL_REF)" >&2
            exit 1
          }
          rm -rf lib && cp -r /tmp/lib-before lib

      - name: Smoke test
        run: node scripts/smoke.mjs

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # No registry-url / NODE_AUTH_TOKEN: trusted publishing (OIDC)
          # requires npm to detect the GitHub OIDC environment, and a blank
          # auth token in .npmrc prevents that fallback.

      - name: Smoke test
        run: node scripts/smoke.mjs

      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish --provenance --access public

      # Trusted publishing: with `id-token: write` and npm CLI >= 11.5.1 +
      # Node >= 22.14, `npm publish --provenance` auto-detects the OIDC
      # environment and authenticates with a short-lived token — no secret
      # needed. One-time setup on npmjs.com (web UI):
      #
      #   npmjs.com -> Access Tokens -> Trusted Publishers -> Add
      #     Provider : GitHub Actions
      #     Organization or user : QQSHI13
      #     Repository           : snowball-stemmers-js
      #     Workflow filename    : release.yml
      #     Allowed actions      : npm publish
      #
      # NPM_TOKEN remains as a fallback for accounts without OIDC.

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
